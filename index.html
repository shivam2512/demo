    // Create a global factory function to build the CodeMirror editor when needed.
    // Uses dynamic import so this file remains a normal script.
    window.createCodeMirrorEditor = async function (initialCode = '') {
      try {
        // dynamic imports
        const [{ EditorView, keymap }, { default: basicSetup }, { sql }, { oneDark }, { EditorState }] = await Promise.all([
          import('https://esm.sh/@codemirror/view@6.11.4'),
          import('https://esm.sh/@codemirror/basic-setup@0.19.1'),
          import('https://esm.sh/@codemirror/lang-sql@0.19.1'),
          import('https://esm.sh/@codemirror/theme-one-dark@0.19.5'),
          import('https://esm.sh/@codemirror/state@0.19.7')
        ]);

        // remove any previous editor content
        const mount = document.getElementById('codeEditor');
        mount.innerHTML = '';

        const state = EditorState.create({
          doc: initialCode,
          extensions: [
            basicSetup,
            sql(),
            oneDark,
            EditorView.editable.of(true)
          ]
        });

        // create view
        window.codeEditor = new EditorView({ state, parent: mount });

        // ensure visible & focused
        setTimeout(() => {
          try { window.codeEditor.focus(); } catch (e) {}
        }, 50);

        return window.codeEditor;
      } catch (err) {
        console.warn('CodeMirror init failed:', err);
        // fallback: show simple textarea
        const mount = document.getElementById('codeEditor');
        mount.innerHTML = '';
        document.getElementById('editorFallbackContainer').style.display = 'block';
        const ta = document.getElementById('assignmentEditorFallback');
        ta.value = initialCode || '';
        ta.focus();
        window.codeEditor = null; // signal fallback mode
        return null;
      }
    }
  </script>

function downloadLinuxPDF(session, filename) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF("p", "mm", "a4");

  const linuxNotes = allNotes.filter(
    n => n.session === session &&
  n.subject === "LINUX" &&
  n.batch === getSelectedBatch()
  );

  if (!linuxNotes.length) {
    showNotification(`No Linux notes found for ${session}`, "danger");
    return;
  }

  const pageWidth = doc.internal.pageSize.width;
  const pageHeight = doc.internal.pageSize.height;

  const marginLeft = 10;
  const marginRight = 10;
  const marginTop = 10;
  const marginBottom = 15;

  const usableWidth = pageWidth - marginLeft - marginRight;
  const lineHeight = 6;

  let y = marginTop;

  linuxNotes.forEach(n => {

    /* ---------- TITLE ---------- */
    doc.setFont("courier", "bold");
    doc.setFontSize(12);

    if (y + lineHeight > pageHeight - marginBottom) {
      doc.addPage();
      y = marginTop;
    }

    doc.text(`${n.date} - ${n.title}`, marginLeft, y);
    y += lineHeight + 2;

    /* ---------- BODY ---------- */
    doc.setFont("courier", "normal");
    doc.setFontSize(10);

    const rawLines = n.body.split("\n");

    rawLines.forEach(rawLine => {

      // 🔹 Wrap line to page width
      const wrappedLines = doc.splitTextToSize(rawLine, usableWidth);

      wrappedLines.forEach(wLine => {
        if (y + lineHeight > pageHeight - marginBottom) {
          doc.addPage();
          y = marginTop;
        }
        doc.text(wLine, marginLeft, y);
        y += lineHeight;
      });
    });

    y += lineHeight; // space between notes
  });

  doc.save(filename);
  showNotification(`${filename} downloaded successfully!`);
}

  <script>
const Assignment = (() => {
  
 

  let studentData = null;

function start() {
  const name = studentName.value.trim();
  const mobile = studentMobile.value.trim();

  if (!name || !mobile) {
    alert('Enter name and mobile number');
    return;
  }

  studentData = { name, mobile };

  studentCard.classList.add('d-none');
  downloadCard.classList.remove('d-none');
}

  function logDownload() {
    downloadCard.classList.add('d-none');
    uploadCard.classList.remove('d-none');
  }


async function upload() {
  const file = fileInput.files[0];

  if (!file) {
    alert('Select a file');
    return;
  }

  if (!studentData) {
    alert('Please enter your details again');
    return;
  }

  // Show floating "Uploading..." notification
  showFloatingNotification('Uploading... ⏳', 'info');

  const reader = new FileReader();

  reader.onload = async () => {
    const payload = {
      action: 'upload',
      name: studentData.name,
      mobile: studentData.mobile,
      fileName: file.name,
      mimeType: file.type,
      file: reader.result.split(',')[1]
    };

    try {
      const res = await fetch(API, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const out = await res.json();

      if (out.status === 'success') {
        showFloatingNotification('✅ Assignment Submitted Successfully!', 'success');
        uploadCard.classList.add('d-none'); // hide upload form after success
      } else {
        showFloatingNotification(`❌ Upload failed: ${out.message || 'Unknown error'}`, 'danger');
      }

    } catch (err) {
      console.error(err);
      showFloatingNotification('❌ Upload failed. Check console for details.', 'danger');
    }
  };

  reader.readAsDataURL(file);
}

// Helper function to show floating notifications
function showFloatingNotification(message, type='info') {
  const notif = document.createElement('div');
  notif.className = `alert alert-${type} text-center position-fixed top-0 start-50 translate-middle-x`;
  notif.style.zIndex = 9999;
  notif.style.minWidth = '250px';
  notif.style.marginTop = '10px';
  notif.textContent = message;
  document.body.appendChild(notif);

  setTimeout(() => {
    notif.remove();
  }, 5000);
}


// Helper function to show notifications
function showUploadNotification(message, type='info') {
  const notifDiv = document.getElementById('uploadNotification');
  notifDiv.innerHTML = `<div class="alert alert-${type} text-center">${message}</div>`;
  setTimeout(() => { notifDiv.innerHTML = ''; }, 5000);
}

  function admin(rows) {
  let html = `<table class="table table-bordered">
    <tr>
      <th>Time</th>
      <th>Name</th>
      <th>Mobile</th>
      <th>File</th>
    </tr>`;

  rows.forEach(r => {
    html += `<tr>
      <td>${r[0]}</td>
      <td>${r[1]}</td>
      <td>${r[2]}</td>
      <td><a href="${r[4]}" target="_blank">Open</a></td>
    </tr>`;
  });

  html += `</table>`;

  document.body.insertAdjacentHTML('beforeend',
    `<div class="modal show d-block">
      <div class="modal-dialog modal-xl">
        <div class="modal-content p-3">
          <h5>🔒 Admin Dashboard</h5>
          ${html}
          <button class="btn btn-secondary mt-3"
            onclick="this.closest('.modal').remove()">Close</button>
        </div>
      </div>
    </div>`
  );
}


  return { start, logDownload, upload, admin };
})();
</script>

      if (data.status !== 'success') {
        alert('❌ Invalid password');
        return;
      }

      let html = `<table class="table table-bordered">
        <tr><th>Name</th><th>Mobile</th><th>File</th></tr>`;

      data.rows.forEach(r => {
        html += `<tr>
          <td>${r[1]}</td>
          <td>${r[2]}</td>
          <td><a href="${r[4]}" target="_blank">Download</a></td>
        </tr>`;
      });

      html += `</table>`;

      document.body.insertAdjacentHTML('beforeend', `
        <div class="modal show d-block">
          <div class="modal-dialog modal-lg">
            <div class="modal-content p-3">
              <h5>Admin Dashboard</h5>
              ${html}
              <button class="btn btn-secondary mt-3"
                onclick="this.closest('.modal').remove()">Close</button>
            </div>
          </div>
        </div>
      `);

    } catch (err) {
      console.error(err);
      alert('Admin fetch failed');
    }
  }
});
</script>

<script>
let examStarted = false;
let examSubmitted = false;
let examDuration = 20 * 60; // 20 minutes
let timerInterval;

// ================= INIT EXAM =================
async function initExam() {

  const name = prompt("Enter Your Full Name");
  if (!name || name.trim().length < 3) {
    alert("Enter valid full name");
    return;
  }

  const mobile = prompt("Enter 10 Digit Mobile Number");
  const cleanMobile = mobile ? mobile.replace(/\D/g, '') : '';

  if (!/^\d{10}$/.test(cleanMobile)) {
    alert("Mobile number must be exactly 10 digits");
    return;
  }

  const email = prompt("Enter Your Email Address");
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  if (!email || !emailPattern.test(email)) {
    alert("Enter valid email address");
    return;
  }

  // Check one attempt
  const res = await fetch(API, {
    method: 'POST',
    body: JSON.stringify({
      action: "checkExamAttempt",
      mobile: cleanMobile
    })
  });

  const data = await res.json();

  if (!data.allowed) {
    alert("❌ You have already attempted this exam.");
    return;
  }

  window.studentExam = {
    name: name.trim(),
    mobile: cleanMobile,
    email: email.trim()
  };

  document.getElementById("examSection").classList.remove("d-none");

  startExam();
}

// ================= START =================
function startExam() {
  examStarted = true;
  enterFullscreen();
  startTimer();
}

// ================= TIMER =================
function startTimer() {
  timerInterval = setInterval(() => {

    let min = Math.floor(examDuration / 60);
    let sec = examDuration % 60;

    document.getElementById("timer").innerText =
      `${min}:${sec < 10 ? '0' : ''}${sec}`;

    examDuration--;

    if (examDuration < 0) {
      clearInterval(timerInterval);
      alert("⏰ Time Up!");
      submitExam();
    }

  }, 1000);
}



// ================= SUBMIT =================

async function submitExam() {
  // 1. Prevent double submission
  const submitBtn = document.querySelector('#examForm button[type="button"]');
  if (submitBtn.disabled) return;
  submitBtn.disabled = true;
  submitBtn.innerText = "Submitting...";

  try {
    const form = document.getElementById('examForm');
    
    // 2. Prepare the payload structure the Script expects
    const payload = {
      action: "secureExamSubmit",           // Missing in your current code
      name: window.studentExam.name,        // Missing in your current code
      mobile: window.studentExam.mobile,    // Missing in your current code
      email: window.studentExam.email,      // Missing in your current code
      answers: {},                          // Object for MCQ (q1-q40)
    };

    // 3. Collect MCQ answers (q1 to q40) into the 'answers' object
    for (let i = 1; i <= 40; i++) {
      const q = form.querySelector(`input[name="q${i}"]:checked`);
      payload.answers[`q${i}`] = q ? q.value : null;
    }

    // 4. Collect SQL answers (q41 to q45) directly into payload
    for (let i = 41; i <= 45; i++) {
      const q = form.querySelector(`textarea[name="q${i}"]`);
      payload[`q${i}`] = q ? q.value.trim() : '';
    }

    // 5. Send to Google Script
    const response = await fetch(window.API, { // Use the global API variable
      method: "POST",
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (result.status === "success") {
      examSubmitted = true;
      clearInterval(timerInterval);
      alert("✅ Exam submitted successfully! Check your email for the scorecard.");
      document.getElementById("examSection").innerHTML = `
        <div class="alert alert-success text-center">
          <h3>Exam Submitted!</h3>
          <p>Your results have been sent to ${window.studentExam.email}</p>
        </div>`;
    } else {
      throw new Error(result.message || "Server rejected submission");
    }

  } catch (err) {
    console.error("Submission error:", err);
    alert("❌ Error: " + err.message);
    submitBtn.disabled = false;
    submitBtn.innerText = "Submit Exam";
  }
}


// ================= SECURITY =================

// Disable right click
document.addEventListener('contextmenu', e => e.preventDefault());

// Disable copy
document.addEventListener('copy', e => e.preventDefault());

// Disable devtools
document.addEventListener('keydown', function(e) {
  if (e.key === "F12" ||
     (e.ctrlKey && e.shiftKey && e.key === 'I') ||
     (e.ctrlKey && e.key === 'U')) {
    e.preventDefault();
  }
});

// Tab switch
document.addEventListener("visibilitychange", function () {
  if (examStarted && !examSubmitted && document.hidden) {
    alert("⚠ Tab switch detected. Auto submitting.");
    submitExam();
  }
});

function enterFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) elem.requestFullscreen();
}
</script>
